name: BoobieTrackr3000
options:
  bundleIdPrefix: nl.weejewel
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  xcodeVersion: '16.0'
  developmentLanguage: en
  knownRegions: [en, nl, de, fr, es, it, pt-BR, zh-Hans, ja]
settings:
  base:
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: FY9967QY8V
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: '1.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLOUDKIT_CONTAINER: iCloud.nl.weejewel.BoobieTrackr3000
targets:
  BoobieTrackr3000:
    type: application
    platform: iOS
    sources: [Shared, iPhone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.weejewel.BoobieTrackr3000
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/iPhone-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: BoobieTrackr
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
        CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER)
    entitlements:
      path: Config/iPhone.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - target: FeedingActivity
      - target: BoobieTrackrWatch
  FeedingActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared/Feeding.swift
      - path: Shared/Theme.swift
      - path: Shared/Assets.xcassets
      - path: Shared/FeedingActivity.swift
      - path: Shared/NewFeedingIntent.swift
      - path: Shared/Localizable.xcstrings
      - path: LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.weejewel.BoobieTrackr3000.activity
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Activity-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Feeding timer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Activity.entitlements
      properties: {}
  BoobieTrackrWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
        excludes: [FeedingActivity.swift, NewFeedingIntent.swift]
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.weejewel.BoobieTrackr3000.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: BoobieTrackr
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: nl.weejewel.BoobieTrackr3000
        WKRunsIndependentlyOfCompanionApp: true
        CloudKitContainerIdentifier: $(CLOUDKIT_CONTAINER)
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER)]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
  BoobieTrackrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BoobieTrackr3000
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.weejewel.BoobieTrackr3000.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BoobieTrackr3000:
    build:
      targets:
        BoobieTrackr3000: all
    test:
      targets: [BoobieTrackrTests]
  BoobieTrackrWatch:
    build:
      targets:
        BoobieTrackrWatch: all
